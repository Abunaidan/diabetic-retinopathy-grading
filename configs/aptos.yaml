# ---------------------------------------------------------------------------
# APTOS 2019 Blindness Detection.
#
#   python scripts/fetch_dataset.py aptos      (accept the competition rules once)
#   python -m dr --config configs/aptos.yaml all
#
# 3 662 images, one eye per subject: there is no patient key to group on, so the
# manifest audit reports `patient_level_grouping: False` and the split degrades
# to image level. That is a property of the dataset, and the report says so
# rather than hiding it.
# ---------------------------------------------------------------------------

seed: 42

paths:
  raw_dir: ~/dr-data/aptos/train_images
  labels_csv: ~/dr-data/aptos/train.csv
  interim_dir: data/interim/aptos
  processed_dir: data/processed/aptos
  artifacts_dir: artifacts/aptos
  reports_dir: reports/aptos

data:
  dataset: aptos
  image_glob: "**/*"
  group_regex: null
  drop_ungradable: true
  max_images: null                  # the whole cohort fits comfortably

features:
  work_size: 512
  clahe_clip: 0.02
  clahe_kernel_fraction: 0.125
  vessel_sigmas: [1.0, 2.0, 3.0, 4.0]
  glcm_distances: [1, 3]
  glcm_angles_deg: [0, 45, 90, 135]
  lbp_radius: 2
  lbp_points: 8
  n_zones: 4
  n_jobs: -1
  cache: true

quality:
  min_mask_fraction: 0.15
  min_focus: 2.0e-5
  max_mean_brightness: 0.93
  min_mean_brightness: 0.04

  # Cohort-relative gradability: flag the worst this-fraction on brightness and
  # on focus. The absolute floors above cannot adapt to a camera - on real
  # EyePACS they fired on zero of 6000 images - so they are only a safety net.
  drop_quantile: 0.01
modeling:
  test_size: 0.25
  cv_folds: 5
  n_search_iter: 25
  nested_cv: true
  nested_outer_folds: 5
  n_bootstrap: 2000
  primary_metric: qwk
  referable_threshold_grade: 2
  target_sensitivity: 0.90
  models: [logreg, random_forest, hist_gbm, ordinal_gbm]
  permutation_repeats: 15
