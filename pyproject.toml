[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinopathy-grading"
version = "1.0.0"
description = "Interpretable diabetic-retinopathy severity grading from fundus photographs using handcrafted retinal biomarkers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniil Shaldin" }]
keywords = ["medical-imaging", "diabetic-retinopathy", "ordinal-classification", "computer-vision", "scikit-learn"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
fast = ["pyarrow>=14.0"]
data = ["kaggle>=1.6"]        # scripts/fetch_dataset.py, for the real cohorts

[project.scripts]
dr = "dr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = ["slow: end-to-end tests that build images and train models"]
